# CI: en cada Pull Request hacia main, GitHub comprueba automáticamente que
# todo está bien. Son los mismos comandos que hacíamos a mano en local.
name: CI

on:
  pull_request:
    branches: [main]

# Las acciones van fijadas por commit (@<sha> # vX.Y.Z) y no por etiqueta (@v7):
# una etiqueta se puede mover a otro código, un commit no. Dependabot las
# mantiene al día (.github/dependabot.yml). Por qué: docs/security-scanning.md

# El robot solo necesita leer el código
permissions:
  contents: read

jobs:
  app:
    name: App (lint, tests, image build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Download the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.12 (same version as the image)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v

      - name: Build the Docker image
        run: docker build -t booking-bot:ci .

      # Trivy busca vulnerabilidades conocidas (CVE) dentro de la imagen: en los
      # paquetes del sistema (Debian) y en las librerías de Python. Falla si hay
      # alguna HIGH o CRITICAL que ya tenga arreglo; las que no tienen arreglo
      # todavía no se pueden corregir, y bloquearían todos los PR sin remedio.
      # Este job no tiene credenciales de AWS ni secretos: si el propio escáner
      # estuviera comprometido (pasó en marzo de 2026), no podría robar nada importante
      - name: Scan the image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: booking-bot:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform (format, validate)
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      # -backend=false: solo comprueba que el código es correcto, sin conectarse
      # al estado en S3 (este robot no tiene credenciales de AWS, ni las necesita)
      - name: Validate infra/bootstrap
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

      - name: Validate infra/app
        run: |
          terraform -chdir=infra/app init -backend=false -input=false
          terraform -chdir=infra/app validate

      - name: Validate infra/edge
        run: |
          terraform -chdir=infra/edge init -backend=false -input=false
          terraform -chdir=infra/edge validate

  security:
    name: Security scan (checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Versión fija: una versión nueva de checkov trae reglas nuevas, y eso debe
      # llegar con un PR que la suba, no romper la CI un día cualquiera
      - name: Install checkov
        run: pip install checkov==3.4.3

      # Revisa el Terraform, el Dockerfile, los workflows y busca claves olvidadas.
      # Falla si encuentra algo que no esté arreglado ni aceptado con un motivo
      # (los comentarios checkov:skip). Cada aviso aceptado: docs/security-scanning.md
      - name: Scan the repository
        run: checkov --directory . --framework terraform dockerfile github_actions secrets --compact --quiet
