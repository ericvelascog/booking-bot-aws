# CD: cada vez que algo entra en main, GitHub construye la imagen, la sube a ECR
# y, si la infraestructura está encendida, la despliega en ECS.
# Solo llega a main código que ha pasado la CI (main está protegida).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # botón "Run workflow" para lanzarlo a mano

# Un despliegue cada vez: si llega otro, espera a que termine el anterior
concurrency:
  group: deploy
  cancel-in-progress: false

# Las acciones van fijadas por commit (@<sha> # vX.Y.Z) y no por etiqueta (@v7):
# una etiqueta se puede mover a otro código, un commit no. Dependabot las
# mantiene al día (.github/dependabot.yml). Por qué: docs/security-scanning.md

permissions:
  id-token: write # para pedir la "tarjeta" OIDC firmada por GitHub
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: booking-bot
  ECS_CLUSTER: booking-bot
  ECS_SERVICE: booking-bot
  TASK_FAMILY: booking-bot
  CONTAINER_NAME: app

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # El ARN del rol va como SECRETO y no como variable: GitHub escribe en el log
      # los datos de cada paso antes de ejecutarlo, y solo tapa los secretos.
      # mask-aws-account-id tapa el número de cuenta en el resto del log
      # (por ejemplo, en la dirección de ECR al hacer docker push). El repo es público.
      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # --pull: siempre parte de la base de Python más reciente (parches de seguridad)
      # --provenance=false: una sola entrada por versión en ECR
      - name: Build and push the image (tag = short commit SHA)
        id: image
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${TAG}"
          docker build --pull --provenance=false --build-arg APP_VERSION="$TAG" -t "$IMAGE" app
          docker push "$IMAGE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Si la infraestructura está apagada (terraform destroy), no hay nada que
      # actualizar: la imagen ya está en ECR y el próximo `terraform apply` la usará
      - name: Is the infrastructure running?
        id: infra
        run: |
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
                     --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" = "ACTIVE" ]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Infrastructure is off: image ${{ steps.image.outputs.tag }} pushed, deployment skipped."
          fi

      - name: Get the current task definition
        if: steps.infra.outputs.running == 'true'
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Put the new image in the task definition
        if: steps.infra.outputs.running == 'true'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      # Rolling deployment: ECS arranca la versión nueva y apaga la vieja cuando
      # la nueva está sana. Si no arranca, el circuit breaker vuelve atrás solo.
      - name: Deploy to ECS and wait until it is stable
        if: steps.infra.outputs.running == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      # Por la URL pública de CloudFront, como un usuario real (el ALB solo atiende
      # a CloudFront). APP_URL es una variable del repo: la salida app_url de infra/edge
      - name: Smoke test (the new version answers /health)
        if: steps.infra.outputs.running == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL" || { echo "::error::Set the APP_URL repository variable (output app_url of infra/edge)"; exit 1; }
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$APP_URL/health" | tee health.json
          grep -q "\"${{ steps.image.outputs.tag }}\"" health.json
